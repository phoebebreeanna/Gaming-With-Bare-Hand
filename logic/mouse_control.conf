[project]
name = Mouse Control

[gestures]
names = move, pre_left_click, left_click, pre_right_click, right_click, scroll_up, scroll_down, idle

[collection]
target_per_gesture = 200
min_record_dist    = 0.02
diversity_every    = 50

[preprocessing]
aug_per_sample = 4
noise_std      = 0.008
rot_max_deg    = 20.0
scale_jitter   = 0.12

[training]
epochs               = 150
batch_size           = 64
learning_rate        = 0.001
focal_gamma          = 2.0
low_conf_threshold   = 0.70
weak_accuracy_threshold = 0.80

[files]
raw_csv       = mouse_raw_gestures.csv
processed_csv = mouse_gesture_data.csv
model_best    = mouse_gesture_model_best.pt
model_out     = mouse_gesture_model.pt
label_encoder = mouse_label_encoder.pkl
