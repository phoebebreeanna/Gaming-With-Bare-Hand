[project]
name = Racing

[gestures]
names = thumb, idle, index_middle, random

[collection]
target_per_gesture = 50
min_record_dist    = 0.015
diversity_every    = 50

[preprocessing]
aug_per_sample = 5
noise_std      = 0.008
rot_max_deg    = 20
scale_jitter   = 0.12

[training]
epochs               = 150
batch_size           = 32
learning_rate        = 0.001
focal_gamma          = 2.0
low_conf_threshold   = 0.70
weak_accuracy_threshold = 0.90

[files]
data_dir      = ../data
raw_csv       = racing_raw_gestures.csv
processed_csv = racing_gesture_data.csv
model_best    = racing_gesture_model_best.pt
model_out     = racing_gesture_model.pt
label_encoder = racing_label_encoder.pkl
