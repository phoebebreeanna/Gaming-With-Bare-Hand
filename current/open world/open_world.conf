[project]
name = open_world

[gestures]
names = gesture_1, gesture_2, gesture_3, gesture_4, idle

[collection]
target_per_gesture = 200
min_record_dist = 0.015
diversity_every = 50

[preprocessing]
aug_per_sample = 5
noise_std = 0.008
rot_max_deg = 20
scale_jitter = 0.12

[training]
epochs = 300
batch_size = 32
learning_rate = 0.001
focal_gamma = 2.0
low_conf_threshold = 0.70
weak_accuracy_threshold = 0.90

[files]
raw_csv = open_world_raw_gestures.csv
processed_csv = open_world_gesture_data.csv
model_best = open_world_gesture_model_best.pt
model_out = open_world_gesture_model.pt
label_encoder = open_world_label_encoder.pkl
