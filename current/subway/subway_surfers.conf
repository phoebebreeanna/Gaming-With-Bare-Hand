[project]
name = subway_surfers

[gestures]
names = jump, roll, left, right, space, idle

[collection]
target_per_gesture = 200
min_record_dist = 0.015
diversity_every = 50

[preprocessing]
aug_per_sample = 5
noise_std = 0.008
rot_max_deg = 20
scale_jitter = 0.12

[training]
epochs = 300
batch_size = 32
learning_rate = 0.001
focal_gamma = 2.0
low_conf_threshold = 0.70
weak_accuracy_threshold = 0.90

[files]
raw_csv = subway_raw_gestures.csv
processed_csv = subway_gesture_data.csv
model_best = subway_gesture_model_best.pt
model_out = subway_gesture_model.pt
label_encoder = subway_label_encoder.pkl
